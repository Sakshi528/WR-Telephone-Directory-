{% extends "base.html" %}
{% block title %}Add Organization – Admin{% endblock %}

{% block content %}
<div class="container mt-4 mb-5">

    <a href="{{ url_for('admin.manage_organizations') }}"
       class="btn btn-outline-secondary btn-sm mb-3">
        <i class="bi bi-arrow-left me-1"></i>Back
    </a>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0"><i class="bi bi-building me-2"></i>Add Organization</h5>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Organization Name <span class="text-danger">*</span></label>
                        <input type="text" name="organization_name" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Category</label>
                        <select name="category_id" id="categorySelect" class="form-select">
                            <option value="">— Uncategorized —</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.category_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Subcategory <span class="text-danger">*</span></label>
                        <input type="text" name="region" class="form-control" required list="subcategoryOptions"
                               placeholder="e.g. ISTS Connected RE Generators In Western Region">
                        <datalist id="subcategoryOptions"></datalist>
                        <div class="form-text">
                            Pick Category first for suggestions, or manage the list under
                            <a href="{{ url_for('admin.manage_categories') }}" target="_blank">Categories</a>.
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Address <span class="text-danger">*</span></label>
                        <textarea name="address" class="form-control" rows="3" required></textarea>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-save me-1"></i>Save Organization
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>

<script>
    (function () {
        const categorySelect = document.getElementById('categorySelect');
        const datalist = document.getElementById('subcategoryOptions');
        function loadSubcategories() {
            datalist.innerHTML = '';
            if (!categorySelect.value) return;
            fetch('/api/organization-categories/' + categorySelect.value + '/subcategories')
                .then(r => r.json())
                .then(names => {
                    names.forEach(name => {
                        const opt = document.createElement('option');
                        opt.value = name;
                        datalist.appendChild(opt);
                    });
                });
        }
        categorySelect.addEventListener('change', loadSubcategories);
    })();
</script>
{% endblock %}
