{% extends "base.html" %}
{% block title %}Add Employee – Admin{% endblock %}

{% block content %}
<div class="container mt-4 mb-5">

    <a href="{{ url_for('user.directory') if request.args.get('next') == 'directory' else url_for('admin.manage_employees') }}"
       class="btn btn-outline-secondary btn-sm mb-3">
        <i class="bi bi-arrow-left me-1"></i>Back
    </a>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="bi bi-person-plus me-2"></i>Add Employee</h5>
        </div>
        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Employee Name <span class="text-danger">*</span></label>
                        <input name="employee_name" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Designation <span class="text-danger">*</span></label>
                        <input name="designation" class="form-control" required>
                    </div>

                    <div class="col-md-6 row g-2"
                         data-org-cascade
                         data-states-url-template="{{ url_for('user.api_organization_type_states', type_id=0) }}"
                         data-organizations-url="{{ url_for('user.api_organizations') }}">
                        <div class="col-12">
                            <label class="form-label">Organization Type <span class="text-danger">*</span></label>
                            <select name="organization_type_id" class="form-select" data-org-type-select required>
                                <option value="">Select organization type…</option>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}" data-state-based="{{ 'true' if cat.is_state_based else 'false' }}">
                                    {{ cat.category_name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12" style="display:none">
                            <label class="form-label">State</label>
                            <select class="form-select" data-org-state-select>
                                <option value="">Select state…</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Organization <span class="text-danger">*</span></label>
                            <select name="organization_id" class="form-select" data-org-select required>
                                <option value="">– Select an Organization Type first –</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Department <span class="text-danger">*</span></label>
                        <select name="department_id" class="form-select">
                            <option value="">– Select –</option>
                            {% for dept in departments %}
                            <option value="{{ dept.id }}">{{ dept.department_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Location<span class="text-danger">*</span></label>
                        <input name="location" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Region<span class="text-danger">*</span></label>
                        <input name="region" class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Office Phone<span class="text-danger">*</span></label>
                        <input name="office_phone" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Residence Phone</label>
                        <input name="residence_phone" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Mobile Phone</label>
                        <input type="tel" name="mobile_phone" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email<span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label d-block">Directory Listing</label>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" name="is_kmp"
                                   class="form-check-input" id="isKmp" value="1">
                            <label class="form-check-label" for="isKmp">
                                <i class="bi bi-journal-text me-1"></i>Show in Telephone Directory (KMP)
                            </label>
                        </div>
                        <div class="form-text">
                            Unchecked employees only appear in the Employee Directory (WRLDC's own staff),
                            not the region-wide Telephone Directory or Email Distribution/Address Book.
                        </div>
                    </div>
                    <div class="col-md-6 d-flex align-items-end">
                        <div class="form-check ms-1">
                            <input type="checkbox" name="is_utility_head"
                                   class="form-check-input" id="utilityHead" value="1">
                            <label class="form-check-label fw-semibold" for="utilityHead">
                                <i class="bi bi-star-fill text-success me-1"></i>Mark as Utility Head
                            </label>
                        </div>
                    </div>

                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-save me-1"></i>Save Employee
                    </button>
                </div>

            </form>
        </div>
    </div>

</div>
{% endblock %}
