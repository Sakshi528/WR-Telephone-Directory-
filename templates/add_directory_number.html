{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <a href="{{ url_for('admin.directory_numbers') }}"
       class="btn btn-outline-secondary btn-sm mb-3">
        <i class="bi bi-arrow-left me-1"></i>Back
    </a>

    <h2>Add Directory Number</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Name<span class="text-danger">*</span></label>
                <!-- <label>Name</label> -->

            <input
                type="text"
                name="name"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Phone no.<span class="text-danger">*</span></label>

            <input
                type="text"
                name="phone_number"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Organisation<span class="text-danger">*</span></label>

            <select name="organization_id" class="form-control" required>
                <option value="">-- Select Organisation --</option>
                {% for org in organizations %}
                <option value="{{ org.id }}">{{ org.organization_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Category<span class="text-danger">*</span></label>

            <input
                type="text"
                name="category"
                value="{{ prefill.category if prefill else '' }}"
                class="form-control"
                required
            >
        </div>

        <button
            class="btn btn-primary"
        >
            Save
        </button>

    </form>

</div>

{% endblock %}
