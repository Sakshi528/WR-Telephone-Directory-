{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h2>Add Directory Number</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Name<span class="text-danger">*</span></label>
                <!-- <label>Name</label> -->

            <input
                type="text"
                name="name"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Phone no.<span class="text-danger">*</span></label>

            <input
                type="text"
                name="phone_number"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Category<span class="text-danger">*</span></label>

            <input
                type="text"
                name="category"
                class="form-control"
                required
            >
        </div>

        <button
            class="btn btn-primary"
        >
            Save
        </button>

    </form>

</div>

{% endblock %}
